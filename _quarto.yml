description: |
  The R package `multvardiv` provides functions to compute the Kullback-Leibler divergence between two Multivariate elliptical Distributions such as the multivariate $t$, Cauchy or generalized Gaussian distributions using analytic expressions of the divergence. For the $t$- and Cauchy distributions, the Rényi, Bhattacharyya and Hellinger divergences are also available. This package also gives tools for the manipulation of these distributions: probability density function, simulation of a random sample, estimation of the parameters, graph.
abstract: >+
  The R package `multvardiv` provides functions to compute the Kullback-Leibler divergence between two Multivariate elliptical Distributions such as the multivariate $t$, Cauchy or generalized Gaussian distributions using analytic expressions of the divergence. For the $t$- and Cauchy distributions, the Rényi, Bhattacharyya and Hellinger divergences are also available. This package also gives tools for the manipulation of these distributions: probability density function, simulation of a random sample, estimation of the parameters, graph.
keywords: [multivariate t distribution, multivariate Cauchy distribution, multivariate generalized Gaussian distribution, Rényi divergence, Bhattacharyya divergence, Hellinger divergence, Kullback-Leibler divergence]
